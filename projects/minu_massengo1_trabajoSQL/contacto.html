<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Cabecera del documento y carga de Bootstrap + Leaflet -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MasterD | Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Barra de navegación para moverse por la web -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">MasterD</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-lg-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <!-- Encabezado de la sección de contacto -->
      <header class="text-center mb-5">
        <p class="text-uppercase text-primary fw-bold mb-2">Contacto</p>
        <h1 class="section-title">Hablemos de tu proyecto</h1>
      </header>

      <!-- Aquí va el formulario y el mapa, todo dentro de una caja central -->
      <section class="contact-shell p-3 p-md-4 p-lg-5">
        <div class="row g-4 align-items-stretch">
          <div class="col-lg-7">
            <form id="contactForm" novalidate>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input id="nombre" name="nombre" type="text" class="form-control" placeholder="Ej. Ana" />
                  <div class="invalid-feedback" data-error-for="nombre"></div>
                </div>

                <div class="col-md-6">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input id="apellidos" name="apellidos" type="text" class="form-control" placeholder="Ej. García López" />
                  <div class="invalid-feedback" data-error-for="apellidos"></div>
                </div>

                <div class="col-md-6">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input id="email" name="email" type="email" class="form-control" placeholder="usuario@dominio.com" />
                  <div class="invalid-feedback" data-error-for="email"></div>
                </div>

                <div class="col-md-6">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input id="telefono" name="telefono" type="tel" class="form-control" placeholder="612345678" maxlength="9" />
                  <div class="invalid-feedback" data-error-for="telefono"></div>
                </div>

                <div class="col-12">
                  <label for="comentarios" class="form-label">Comentarios</label>
                  <textarea id="comentarios" name="comentarios" class="form-control" rows="5" placeholder="Cuéntanos brevemente qué necesitas..."></textarea>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-3 mt-4">
                <button type="submit" class="btn btn-primary px-4">Enviar</button>
                <button type="reset" id="resetBtn" class="btn btn-outline-secondary px-4">Limpiar</button>
              </div>

              <div id="formMessage" class="alert mt-3 d-none" role="alert"></div>
            </form>
          </div>

          <div class="col-lg-5">
            <div class="map-card h-100">
              <div id="map" aria-label="Mapa de ubicación"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Pie de página con enlaces rápidos -->
    <footer class="footer py-4 mt-5">
      <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
        <div>
          <h5 class="mb-1">MasterD</h5>
          <p class="mb-0 text-light-emphasis">Diseño y desarrollo para marcas que quieren crecer.</p>
        </div>
        <div class="d-flex gap-3">
          <a href="index.html" class="text-light text-decoration-none">Inicio</a>
          <a href="galeria.html" class="text-light text-decoration-none">Galería</a>
          <a href="contacto.html" class="text-light text-decoration-none">Contacto</a>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/main.js"></script>
  </body>
</html>
