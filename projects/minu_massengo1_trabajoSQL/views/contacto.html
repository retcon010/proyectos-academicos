<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterD | Contacto</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="../css/styles.css">
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand ms-auto ms-lg-0" href="../index.html">MasterD</a>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-lg-auto gap-lg-2">
            <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacto.html" aria-current="page">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1 py-4 py-lg-5">
      <div class="col-lg-8 mx-auto mb-4 mb-lg-5 d-none d-md-block">
        <div class="ratio ratio-21x9">
          <img src="../assets/images/photo-1500530855697-b586d89ba3ee.jpg" class="img-fluid rounded shadow object-fit-cover" alt="Paisaje natural con montañas y cielo abierto">
        </div>
      </div>

      <header class="text-center mb-4 mb-lg-5">
        <h1 class="display-4">Contacto</h1>
      </header>

      <section class="row g-4 align-items-center">
          <div class="col-lg-7">
            <h2 class="h3 mb-3">Rellena formulario</h2>
            <form id="contactForm" novalidate>
              <div class="row g-3">
                <div class="col-12">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input id="nombre" name="nombre" type="text" class="form-control" placeholder="Nombre" autocomplete="given-name" required minlength="3" maxlength="40">
                  <div class="invalid-feedback" data-error-for="nombre"></div>
                </div>

                <div class="col-12">
                  <label for="apellidos" class="form-label">Apellidos</label>
                  <input id="apellidos" name="apellidos" type="text" class="form-control" placeholder="Apellidos" autocomplete="family-name" required minlength="4" maxlength="60">
                  <div class="invalid-feedback" data-error-for="apellidos"></div>
                </div>

                <div class="col-12">
                  <label for="email" class="form-label">Correo electrónico</label>
                  <input id="email" name="email" type="email" class="form-control" placeholder="usuario@dominio.com" autocomplete="email" required maxlength="120">
                  <div class="invalid-feedback" data-error-for="email"></div>
                </div>

                <div class="col-12">
                  <label for="telefono" class="form-label">Teléfono</label>
                  <input id="telefono" name="telefono" type="tel" class="form-control" placeholder="XXX XXX XXX" autocomplete="tel" inputmode="numeric" required minlength="9" maxlength="11">
                  <div class="invalid-feedback" data-error-for="telefono"></div>
                </div>

                <div class="col-12">
                  <label for="comentarios" class="form-label">Comentarios</label>
                  <textarea id="comentarios" name="comentarios" class="form-control" rows="5" placeholder="Cuéntanos brevemente qué necesitas..."></textarea>
                </div>
              </div>

              <div class="d-flex flex-wrap gap-3 mt-4">
                <button type="submit" class="btn btn-primary">Enviar</button>
                <button type="reset" id="resetBtn" class="btn btn-outline-secondary">Limpiar</button>
              </div>

              <div id="formMessage" class="alert mt-3 d-none" role="alert"></div>
            </form>
          </div>

          <div class="col-lg-5">
            <div class="ratio ratio-4x3">
              <div id="map" aria-label="Mapa de ubicación" role="application"></div>
            </div>
          </div>
      </section>
    </main>

    <footer class="bg-primary text-white py-4 mt-auto">
      <div class="container">
        <div class="row g-4">
          <section class="col-12 col-md-4">
            <h2 class="h5">MasterD</h2>
            <p class="mb-0">Diseño y desarrollo para marcas que quieren crecer.</p>
          </section>
          <nav class="col-12 col-md-4" aria-label="Enlaces del pie de página">
            <h2 class="h5">Enlaces</h2>
            <ul class="list-unstyled mb-0">
              <li><a href="../index.html" class="link-light">Inicio</a></li>
              <li><a href="galeria.html" class="link-light">Portafolio</a></li>
              <li><a href="contacto.html" class="link-light">Contacto</a></li>
            </ul>
          </nav>
          <section class="col-12 col-md-4" aria-label="Redes sociales">
            <h2 class="h5">Síguenos</h2>
            <div class="d-flex gap-3 fs-4">
              <a class="link-light" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook, sitio oficial"><i class="bi bi-facebook" aria-hidden="true"></i></a>
              <a class="link-light" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram, sitio oficial"><i class="bi bi-instagram" aria-hidden="true"></i></a>
              <a class="link-light" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn, sitio oficial"><i class="bi bi-linkedin" aria-hidden="true"></i></a>
            </div>
          </section>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../js/main.js"></script>
  </body>
</html>
